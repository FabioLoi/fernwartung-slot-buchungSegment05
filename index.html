<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segment 05 ALDS PC – Slot-Buchung</title>

<style>
:root {
  --bg: #F6F6F6;
  --panel: #FFFFFF;
  --panel-2: #F6F6F6;
  --border: #D0D0D0;
  --text: #343434;
  --muted: #646464;
  --primary: #00893D;
  --secondary: #005E46;
  --tertiary: #476E75;
  --success-bg: #E6F2EC;
  --danger-bg: #FDECEC;
  --danger-border: #E8A0A0;
  --danger-text: #8A3030;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  justify-content: center;
  padding: 32px 16px 64px;
}

.app {
  width: 100%;
  max-width: 480px;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--primary);
  text-align: center;
  margin-bottom: 6px;
}

h1 {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 28px;
}

.ring-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 22px;
  position: relative;
}

.ring {
  width: 176px;
  height: 176px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.ring::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    var(--ring-color, var(--primary))
    calc(var(--pct, 100) * 1%),
    #D0D0D0 0
  );

  -webkit-mask: radial-gradient(
    farthest-side,
    transparent calc(100% - 10px),
    #000 calc(100% - 9px)
  );

  mask: radial-gradient(
    farthest-side,
    transparent calc(100% - 10px),
    #000 calc(100% - 9px)
  );
}

.ring-core {
  width: 138px;
  height: 138px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1;
  box-shadow: 0 4px 16px rgba(52, 52, 52, .08);
}

.ring-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 12px 2px var(--primary);
  margin-bottom: 8px;
}

.ring-time {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
}

.ring-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  text-align: center;
  padding: 0 10px;
  max-width: 120px;
}

.panel,
.name-gate {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(52, 52, 52, .05);
}

.panel h2 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--secondary);
  margin: 0 0 14px;
  font-weight: 700;
}

label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

input[type="text"],
textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  margin-bottom: 14px;
  resize: vertical;
}

textarea {
  min-height: 64px;
}

input:focus,
textarea:focus,
button:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}

.duration-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 4px;
}

.dur-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 12px 3px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.dur-btn:hover,
.dur-btn.selected {
  border-color: var(--primary);
  background: var(--success-bg);
  color: var(--secondary);
}

button.primary {
  width: 100%;
  background: var(--primary);
  color: #FFFFFF;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

button.primary:hover {
  background: var(--secondary);
}

button.primary:disabled {
  opacity: .4;
  cursor: not-allowed;
}

button.ghost {
  width: 100%;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  cursor: pointer;
  margin-top: 8px;
}

button.ghost:hover {
  color: var(--secondary);
  border-color: var(--primary);
}

.req-card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}

.req-card .who {
  font-weight: 700;
  font-size: 14px;
}

.req-card .meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin: 2px 0 8px;
}

.req-card .reason {
  font-size: 13px;
  margin-bottom: 10px;
  line-height: 1.4;
}

.req-actions {
  display: flex;
  gap: 8px;
}

.req-actions button {
  flex: 1;
  border: 0;
  border-radius: 6px;
  padding: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.btn-accept {
  background: var(--primary);
  color: #FFFFFF;
}

.btn-decline {
  background: var(--success-bg);
  color: var(--secondary);
  border: 1px solid var(--primary) !important;
}

.name-gate {
  text-align: center;
}

.name-gate p {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 16px;
}

.empty-note,
.footer-note,
.status-note {
  color: var(--muted);
  text-align: center;
}

.empty-note {
  font-size: 13px;
  padding: 6px 0 2px;
}

.footer-note {
  font-family: var(--mono);
  font-size: 11px;
  margin-top: 18px;
}

.status-note {
  font-size: 11px;
  margin-top: 6px;
  min-height: 14px;
}

.history-list {
  max-height: 360px;
  overflow-y: auto;
}

.history-entry {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.history-entry:last-child {
  border-bottom: none;
}

.history-entry strong {
  color: var(--text);
}

.history-entry span,
.history-entry small {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
}

.mini-status {
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: 190px;
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 6px 22px rgba(52, 52, 52, .15);
  z-index: 10;
  font-size: 12px;
}

.mini-status strong {
  display: block;
  color: var(--secondary);
  margin-bottom: 3px;
}

.mini-time {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
}

.mini-toggle {
  position: fixed;
  right: 14px;
  bottom: 14px;
  background: var(--primary);
  color: #FFFFFF;
  border: 0;
  border-radius: 20px;
  padding: 9px 12px;
  font-weight: 700;
  z-index: 9;
  cursor: pointer;
}

.request-notification {
  position: fixed;
  right: 14px;
  bottom: 70px;
  max-width: 280px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid;
  box-shadow: 0 6px 22px rgba(52, 52, 52, .15);
  z-index: 30;
  font-size: 13px;
}

.request-notification.accepted {
  background: var(--success-bg);
  border-color: var(--primary);
  color: var(--secondary);
}

.request-notification.declined {
  background: var(--danger-bg);
  border-color: var(--danger-border);
  color: var(--danger-text);
}

.hidden {
  display: none;
}

@media (max-width: 420px) {
  .duration-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .request-notification {
    right: 8px;
    bottom: 70px;
  }
}
</style>
</head>

<body>
<div class="app">
  <div class="eyebrow">Segment 05 ALDS PC</div>

  <h1>Wer ist gerade auf dem PC?</h1>

  <div id="root"></div>

  <div class="footer-note">
    Aktualisiert automatisch im Hintergrund<br>
    Entwickelt von Fabio Loi
  </div>

  <div class="status-note" id="statusNote"></div>
</div>

<div id="miniStatus" class="mini-status hidden">
  <button
    id="miniClose"
    style="position:absolute;right:6px;top:4px;border:0;background:transparent;cursor:pointer"
  >
    ×
  </button>

  <strong>Segment 05 ALDS PC</strong>
  <div id="miniContent"></div>
</div>

<button id="miniToggle" class="mini-toggle">
  Status anzeigen
</button>

<div id="requestNotification" class="request-notification hidden"></div>

<script>
const NAME_KEY = "my-name";
const DURATIONS = [1, 2, 5, 10, 20, 30];

let myName = "";
let session = null;
let requests = [];
let history = [];
let pendingReqMinutes = null;
let pendingReqReason = "";
let notificationTimer = null;

const root = document.getElementById("root");
const statusNote = document.getElementById("statusNote");
const miniStatus = document.getElementById("miniStatus");
const miniToggle = document.getElementById("miniToggle");
const miniContent = document.getElementById("miniContent");
const requestNotification =
  document.getElementById("requestNotification");

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function fmt(milliseconds) {
  milliseconds = Math.max(0, milliseconds);

  const totalSeconds = Math.floor(milliseconds / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;

  return String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}

function sameName(first, second) {
  return (first || "").trim().toLowerCase() ===
    (second || "").trim().toLowerCase();
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value || "";
  return div.innerHTML;
}

function isEditing() {
  const active = document.activeElement;

  return active &&
    root.contains(active) &&
    (
      active.tagName === "INPUT" ||
      active.tagName === "TEXTAREA"
    );
}

function formatHistoryTime(timestamp) {
  return new Date(timestamp).toLocaleString(
    "de-DE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function showRequestNotification(type, message) {
  requestNotification.className =
    "request-notification " + type;

  requestNotification.textContent = message;

  clearTimeout(notificationTimer);

  notificationTimer = setTimeout(() => {
    requestNotification.className =
      "request-notification hidden";
  }, 5000);
}

function checkRequestNotifications(oldRequests) {
  if (!myName) return;

  const oldMap = {};

  oldRequests.forEach(request => {
    oldMap[request.id] = request.status;
  });

  requests.forEach(request => {
    const oldStatus = oldMap[request.id];

    if (
      sameName(request.fromUser, myName) &&
      oldStatus === "pending" &&
      request.status === "accepted"
    ) {
      showRequestNotification(
        "accepted",
        "Deine Anfrage wurde angenommen."
      );
    }

    if (
      sameName(request.fromUser, myName) &&
      oldStatus === "pending" &&
      request.status === "declined"
    ) {
      showRequestNotification(
        "declined",
        "Deine Anfrage wurde abgelehnt."
      );
    }
  });
}

async function loadBoard() {
  try {
    const response = await fetch("/api/board");

    if (!response.ok) {
      throw new Error("Board konnte nicht geladen werden");
    }

    const data = await response.json();
    const oldRequests = requests;

    session = data.session || null;

    requests = Array.isArray(data.requests)
      ? data.requests
      : [];

    history = Array.isArray(data.history)
      ? data.history
      : [];

    checkRequestNotifications(oldRequests);
  } catch (error) {
    statusNote.textContent =
      "Server momentan nicht erreichbar.";
  }
}

async function saveBoard(
  newSession,
  newRequests,
  newHistory = history
) {
  session = newSession;
  requests = newRequests;
  history = newHistory;

  try {
    const response = await fetch("/api/board", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        session,
        requests,
        history
      })
    });

    if (!response.ok) {
      throw new Error("Speichern fehlgeschlagen");
    }
  } catch (error) {
    statusNote.textContent =
      "Speichern fehlgeschlagen.";
  }
}

function createHistoryEntry(
  currentSession,
  finishedAt,
  reason
) {
  return {
    id: uid(),
    user: currentSession.user,
    startTime: currentSession.startTime,
    endTime: finishedAt,
    bookedDuration: currentSession.duration,
    actualDuration: Math.max(
      0,
      Math.round(
        (finishedAt - currentSession.startTime) / 60000
      )
    ),
    reason
  };
}

async function bookSlot(minutes) {
  const now = Date.now();

  await saveBoard(
    {
      id: uid(),
      user: myName,
      duration: minutes,
      startTime: now,
      endTime: now + minutes * 60000
    },
    [],
    history
  );

  render();
}

async function endSession(
  reason = "vorzeitig beendet"
) {
  if (!session) return;

  const finishedAt = Date.now();

  const entry = createHistoryEntry(
    session,
    finishedAt,
    reason
  );

  const updatedHistory = [
    entry,
    ...history
  ].slice(0, 100);

  await saveBoard(
    null,
    [],
    updatedHistory
  );

  render();
}

async function sendRequest(minutes) {
  if (!session) return;

  const reasonElement =
    document.getElementById("reason");

  const request = {
    id: uid(),
    sessionId: session.id,
    fromUser: myName,
    reason: reasonElement
      ? reasonElement.value.trim()
      : pendingReqReason,
    minutes,
    status: "pending",
    timestamp: Date.now()
  };

  const currentRequests = requests.filter(
    item => item.sessionId === session.id
  );

  currentRequests.push(request);

  await saveBoard(
    session,
    currentRequests,
    history
  );

  pendingReqMinutes = null;
  pendingReqReason = "";

  render();
}

async function acceptRequest(requestId) {
  const request = requests.find(
    item => item.id === requestId
  );

  if (!request) return;

  const now = Date.now();

  const updatedRequests = requests.map(item =>
    item.id === requestId
      ? {
          ...item,
          status: "accepted",
          decidedAt: now
        }
      : item
  );

  await saveBoard(
    {
      id: uid(),
      user: request.fromUser,
      duration: request.minutes,
      startTime: now,
      endTime: now + request.minutes * 60000
    },
    updatedRequests,
    history
  );

  render();
}

async function declineRequest(requestId) {
  const updatedRequests = requests.map(item =>
    item.id === requestId
      ? {
          ...item,
          status: "declined",
          decidedAt: Date.now()
        }
      : item
  );

  await saveBoard(
    session,
    updatedRequests,
    history
  );

  render();
}

function updateMiniStatus() {
  if (!session) {
    miniContent.innerHTML =
      '<b style="color:var(--primary)">PC frei</b>';

    return;
  }

  miniContent.innerHTML =
    "Belegt von <b>" +
    escapeHtml(session.user) +
    "</b><br>" +
    '<span class="mini-time">' +
    fmt(session.endTime - Date.now()) +
    "</span> verbleibend";
}

function render() {
  if (isEditing()) return;

  const scrollPosition = window.scrollY;

  if (!myName) {
    root.innerHTML = `
      <div class="name-gate">
        <p>Bitte gib deinen Namen ein.</p>

        <input
          id="nameInput"
          type="text"
          placeholder="Dein Name"
        >

        <button class="primary" id="nameSubmit">
          Weiter
        </button>
      </div>
    `;

    const nameInput =
      document.getElementById("nameInput");

    const nameSubmit =
      document.getElementById("nameSubmit");

    nameSubmit.onclick = () => {
      const value = nameInput.value.trim();

      if (!value) return;

      myName = value;
      localStorage.setItem(NAME_KEY, myName);
      render();
    };

    nameInput.onkeydown = event => {
      if (event.key === "Enter") {
        nameSubmit.click();
      }
    };

    updateMiniStatus();
    window.scrollTo(0, scrollPosition);
    return;
  }

  const isFree = !session;
  const isMine = session &&
    sameName(session.user, myName);

  const relevantRequests = requests.filter(request =>
    session &&
    request.sessionId === session.id &&
    request.status === "pending"
  );

  let percentage = 100;
  let timeLabel = "";
  let sessionLabel = "PC frei";

  if (session) {
    const total = session.endTime - session.startTime;
    const remaining = session.endTime - Date.now();

    percentage = Math.max(
      0,
      Math.min(100, (remaining / total) * 100)
    );

    timeLabel = fmt(remaining);
    sessionLabel = "Belegt von " + session.user;
  }

  let html = `
    <div class="ring-wrap">
      <div
        class="ring"
        style="
          --pct:${percentage};
          --ring-color:${
            session
              ? "var(--secondary)"
              : "var(--primary)"
          };
        "
      >
        <div class="ring-core">
          <div class="ring-dot"></div>

          <div class="ring-time">
            ${session ? timeLabel : "FREI"}
          </div>

          <div class="ring-label">
            ${escapeHtml(sessionLabel)}
          </div>
        </div>
      </div>
    </div>
  `;

  if (isFree) {
    html += `
      <div class="panel">
        <h2>Slot buchen</h2>

        <label>Dauer wählen</label>

        <div class="duration-grid">
          ${DURATIONS.map(duration => `
            <button
              class="dur-btn"
              data-book="${duration}"
            >
              ${duration} Min
            </button>
          `).join("")}
        </div>
      </div>
    `;
  } else if (isMine) {
    html += `
      <div class="panel">
        <h2>Deine Sitzung</h2>

        <div
          class="empty-note"
          style="text-align:left"
        >
          Dauer: ${session.duration} Min ·
          verbleibend ${timeLabel}
        </div>

        <button class="ghost" id="endSession">
          Sitzung jetzt beenden
        </button>
      </div>

      <div class="panel">
        <h2>Offene Unterbrechungsanfragen</h2>

        ${
          relevantRequests.length === 0
            ? `
              <div class="empty-note">
                Keine offenen Anfragen
              </div>
            `
            : relevantRequests.map(request => `
              <div class="req-card">
                <div class="who">
                  ${escapeHtml(request.fromUser)}
                </div>

                <div class="meta">
                  möchte ${request.minutes} Min übernehmen
                </div>

                <div class="reason">
                  ${
                    escapeHtml(request.reason) ||
                    "(keine Begründung)"
                  }
                </div>

                <div class="req-actions">
                  <button
                    class="btn-accept"
                    data-accept="${request.id}"
                  >
                    Annehmen
                  </button>

                  <button
                    class="btn-decline"
                    data-decline="${request.id}"
                  >
                    Ablehnen
                  </button>
                </div>
              </div>
            `).join("")
        }
      </div>
    `;
  } else {
    html += `
      <div class="panel">
        <h2>Unterbrechung anfragen</h2>

        <label>Begründung</label>

        <textarea
          id="reason"
          placeholder="Warum brauchst du den PC gerade?"
        >${escapeHtml(pendingReqReason)}</textarea>

        <label>Wie lange brauchst du ihn?</label>

        <div class="duration-grid">
          ${DURATIONS.map(duration => `
            <button
              class="dur-btn ${
                pendingReqMinutes === duration
                  ? "selected"
                  : ""
              }"
              data-request="${duration}"
            >
              ${duration} Min
            </button>
          `).join("")}
        </div>

        <button
          class="primary"
          id="sendRequest"
          ${pendingReqMinutes ? "" : "disabled"}
        >
          Anfrage senden
        </button>
      </div>
    `;
  }

  html += `
    <div class="panel">
      <h2>Buchungshistorie</h2>

      ${
        history.length === 0
          ? `
            <div class="empty-note">
              Noch keine abgeschlossenen Sitzungen
            </div>
          `
          : `
            <div class="history-list">
              ${history.map(entry => `
                <div class="history-entry">
                  <strong>
                    ${escapeHtml(entry.user)}
                  </strong>

                  <span>
                    ${formatHistoryTime(entry.startTime)}
                    –
                    ${formatHistoryTime(entry.endTime)}
                  </span>

                  <small>
                    Gebucht: ${entry.bookedDuration} Min ·
                    genutzt: ${entry.actualDuration} Min
                  </small>
                </div>
              `).join("")}
            </div>
          `
      }
    </div>
  `;

  root.innerHTML = html;

  root.querySelectorAll("[data-book]").forEach(button => {
    button.onclick = () => {
      bookSlot(Number(button.dataset.book));
    };
  });

  root.querySelectorAll("[data-request]").forEach(button => {
    button.onclick = () => {
      pendingReqMinutes = Number(button.dataset.request);
      render();
    };
  });

  const reasonElement =
    document.getElementById("reason");

  if (reasonElement) {
    reasonElement.oninput = () => {
      pendingReqReason = reasonElement.value;
    };
  }

  const sendRequestButton =
    document.getElementById("sendRequest");

  if (sendRequestButton) {
    sendRequestButton.onclick = () => {
      if (pendingReqMinutes) {
        sendRequest(pendingReqMinutes);
      }
    };
  }

  const endSessionButton =
    document.getElementById("endSession");

  if (endSessionButton) {
    endSessionButton.onclick = () => {
      endSession("vorzeitig beendet");
    };
  }

  root.querySelectorAll("[data-accept]").forEach(button => {
    button.onclick = () => {
      acceptRequest(button.dataset.accept);
    };
  });

  root.querySelectorAll("[data-decline]").forEach(button => {
    button.onclick = () => {
      declineRequest(button.dataset.decline);
    };
  });

  updateMiniStatus();

  window.scrollTo(0, scrollPosition);
}

miniToggle.onclick = () => {
  miniStatus.classList.remove("hidden");
  miniToggle.classList.add("hidden");
};

document.getElementById("miniClose").onclick = () => {
  miniStatus.classList.add("hidden");
  miniToggle.classList.remove("hidden");
};

setInterval(async () => {
  if (session && session.endTime <= Date.now()) {
    await endSession("automatisch abgelaufen");
  } else {
    if (session && !isEditing()) {
      render();
    }

    updateMiniStatus();
  }
}, 1000);

setInterval(async () => {
  if (!isEditing()) {
    const scrollPosition = window.scrollY;

    await loadBoard();
    render();

    window.scrollTo(0, scrollPosition);
  }
}, 4000);

(async function init() {
  try {
    myName = localStorage.getItem(NAME_KEY) || "";
  } catch (error) {
    myName = "";
  }

  await loadBoard();
  render();
})();
</script>
</body>
</html>
